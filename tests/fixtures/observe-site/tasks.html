<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tasklet — Tasks</title></head>
<body>
<header><nav aria-label="Main"><a href="/tasks">Tasks</a> <a href="/settings">Settings</a></nav></header>
<main>
  <h1>Tasks</h1>
  <button id="refresh" type="button">Refresh</button>
  <ul id="task-list"></ul>
  <h2>New task</h2>
  <form id="new-task" aria-label="New task">
    <label for="title">Title</label> <input id="title" name="title" required>
    <label for="due">Due date</label> <input id="due" name="due" type="date">
    <button type="submit">Add task</button>
  </form>
  <p id="live" role="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
